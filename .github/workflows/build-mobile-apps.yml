name: Build Mobile Apps (iOS & Android)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  # ============================================================================
  # 1. BUILD ANDROID APK
  # ============================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências Web
        run: npm ci

      - name: Compilar Web (Vite)
        run: npm run build

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Sincronizar Capacitor Android
        run: npx cap sync android

      - name: Tornar gradlew executável
        run: chmod +x android/gradlew

      - name: Compilar APK Android (Debug)
        run: cd android && ./gradlew assembleDebug

      - name: Salvar APK Gerado como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: MegaGestao-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # ============================================================================
  # 2. BUILD iOS (macOS Runner com Xcode Oficial)
  # ============================================================================
  build-ios:
    name: Build iOS (Xcode macOS)
    runs-on: macos-14
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Selecionar Versão do Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências Web
        run: npm ci

      - name: Compilar Web (Vite)
        run: npm run build

      - name: Sincronizar Capacitor iOS
        run: npx cap sync ios

      - name: Compilar Arquivo iOS no Xcode
        run: |
          cd ios/App
          xcodebuild clean build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Salvar Projeto e Build iOS
        uses: actions/upload-artifact@v4
        with:
          name: MegaGestao-iOS-Build
          path: ios/App/build/Release-iphoneos/

