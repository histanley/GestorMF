name: Build Mobile Apps (iOS & Android)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    name: Build iOS (macOS Xcode)
    runs-on: macos-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependências Web
        run: npm ci

      - name: Compilar Web (Vite)
        run: npm run build

      - name: Sincronizar Capacitor iOS
        run: npx cap sync ios

      - name: Compilar Projeto no Xcode e Gerar IPA
        run: |
          cd ios/App
          xcodebuild clean build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          
          mkdir -p build/Payload
          cp -r build/Build/Products/Debug-iphoneos/App.app build/Payload/
          cd build
          zip -r MegaGestao-iOS.ipa Payload/

      - name: Salvar Artefato iOS
        uses: actions/upload-artifact@v4
        with:
          name: MegaGestao-iOS-IPA
          path: ios/App/build/MegaGestao-iOS.ipa

  build-android:
    name: Build Android (Ubuntu Gradle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar Dependências Web
        run: npm ci

      - name: Compilar Web (Vite)
        run: npm run build

      - name: Sincronizar Capacitor Android
        run: npx cap sync android

      - name: Compilar APK Android Debug
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Salvar Artefato Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaGestao-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
